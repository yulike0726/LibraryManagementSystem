<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>图书管理系统</h1>
            <nav class="nav"><!-- 动态加载 --></nav>
        </div>
    </header>

    <main class="container main-content">
        <!-- 管理员：全局统计；读者：个人统计 -->
        <section class="stats-row" id="statsSection">
            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-number" id="statNum1">-</div>
                    <div class="stat-label" id="statLabel1">馆藏图书</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-number" id="statNum2">-</div>
                    <div class="stat-label" id="statLabel2">注册读者</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-number" id="statNum3">-</div>
                    <div class="stat-label" id="statLabel3">借出中</div>
                </div>
            </div>
            <div class="stat-card overdue">
                <div class="stat-info">
                    <div class="stat-number" id="statNum4">-</div>
                    <div class="stat-label" id="statLabel4">超期未还</div>
                </div>
            </div>
        </section>

        <!-- 图书检索 -->
        <section class="card">
            <div class="card-header">
                <h2>图书检索</h2>
            </div>
            <div class="card-body">
                <div class="search-bar">
                    <input type="text" id="searchKeyword" placeholder="输入书名、作者、ISBN或分类关键词...">
                    <select id="searchCategory">
                        <option value="">全部分类</option>
                        <option value="计算机科学">计算机科学</option>
                        <option value="编程语言">编程语言</option>
                        <option value="数据结构">数据结构</option>
                        <option value="算法">算法</option>
                        <option value="网络">网络</option>
                        <option value="数据库">数据库</option>
                        <option value="软件工程">软件工程</option>
                    </select>
                    <select id="sortField">
                        <option value="">默认排序</option>
                        <option value="TITLE">按书名</option>
                        <option value="AUTHOR">按作者</option>
                        <option value="PUBLISH_DATE">按出版日期</option>
                        <option value="AVAILABLE_COUNT">按可借数量</option>
                    </select>
                    <select id="sortAlgorithm">
                        <option value="quick">快速排序</option>
                        <option value="merge">归并排序</option>
                        <option value="bubble">冒泡排序</option>
                    </select>
                    <button class="btn btn-primary" onclick="searchBooks()">搜索</button>
                </div>
            </div>
        </section>

        <!-- 图书列表 -->
        <section class="card">
            <div class="card-header"><h2>图书列表</h2></div>
            <div class="card-body">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ISBN</th><th>书名</th><th>作者</th><th>分类</th>
                                <th>库存（可借/总数）</th><th>出版社</th>
                            </tr>
                        </thead>
                        <tbody id="bookTableBody">
                            <tr><td colspan="6" class="text-center">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 热门排行 -->
        <section class="card">
            <div class="card-header"><h2>热门图书排行榜（TOP 10）</h2></div>
            <div class="card-body">
                <div class="table-container">
                    <table>
                        <thead><tr><th>排名</th><th>书名</th><th>作者</th><th>借阅次数</th></tr></thead>
                        <tbody id="popularTableBody">
                            <tr><td colspan="4" class="text-center">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer"><p>图书管理系统 &copy; 2024 软件工程课程设计</p></footer>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/book.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initPage('home');
            loadDashboard();
            searchBooks();
            loadPopularBooks();
        });

        async function loadDashboard() {
            const auth = getAuth();
            if (auth.role === 'admin') {
                // 管理员：全系统统计
                try {
                    const books = await API.get('/books');
                    const readers = await API.get('/readers');
                    const borrowing = await API.get('/borrow-records?status=BORROWED');
                    const overdue = await API.get('/stats/overdue');
                    document.getElementById('statNum1').textContent = books.total || 0;
                    document.getElementById('statNum2').textContent = readers.total || 0;
                    document.getElementById('statNum3').textContent = borrowing.total || 0;
                    document.getElementById('statNum4').textContent = overdue.total || 0;
                    document.getElementById('statLabel1').textContent = '馆藏图书';
                    document.getElementById('statLabel2').textContent = '注册读者';
                    document.getElementById('statLabel3').textContent = '借出中';
                    document.getElementById('statLabel4').textContent = '超期未还';
                } catch(e) { console.error(e); }
            } else {
                // 读者：个人借阅概览
                const readerId = auth.readerId;
                const statsRow = document.getElementById('statsSection');
                statsRow.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-number">${escapeHtml(auth.name)}</div>
                            <div class="stat-label">欢迎你，${auth.readerType === 'TEACHER' ? '教师' : '同学'}</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-number" id="myBorrowing">-</div>
                            <div class="stat-label">当前借阅</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-number" id="myLimit">${auth.maxBorrows}</div>
                            <div class="stat-label">借阅上限</div>
                        </div>
                    </div>
                    <div class="stat-card overdue">
                        <div class="stat-info">
                            <div class="stat-number" id="myOverdue">-</div>
                            <div class="stat-label">超期未还</div>
                        </div>
                    </div>`;
                try {
                    const records = await API.get('/borrow-records?readerId=' + readerId);
                    const borrowed = records.data?.filter(r => r.status === 'BORROWED' || r.status === 'OVERDUE') || [];
                    const overdue = records.data?.filter(r => r.status === 'OVERDUE') || [];
                    document.getElementById('myBorrowing').textContent = borrowed.length;
                    document.getElementById('myOverdue').textContent = overdue.length;
                } catch(e) { console.error(e); }
            }
        }

        async function loadPopularBooks() {
            try {
                const result = await API.get('/stats/popular-books?top=10');
                const tbody = document.getElementById('popularTableBody');
                if (result.data && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(b => `
                        <tr>
                            <td><span class="rank-num rank-${b.rank}">${b.rank}</span></td>
                            <td>${escapeHtml(b.title)}</td>
                            <td>${escapeHtml(b.author)}</td>
                            <td>${b.borrowCount} 次</td>
                        </tr>`).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">暂无借阅数据</td></tr>';
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById('searchKeyword').addEventListener('keypress', e => { if(e.key==='Enter') searchBooks(); });
    </script>
</body>
</html>
