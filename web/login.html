<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 图书管理系统</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: #fff;
            width: 400px;
            border: 1px solid #ddd;
            padding: 40px;
        }
        .login-container h2 {
            text-align: center; font-size: 1.3em; color: #2c3e50;
            margin-bottom: 8px; font-weight: normal;
        }
        .login-container .subtitle {
            text-align: center; color: #999; font-size: 0.85em; margin-bottom: 24px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85em; color: #555; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 3px; font-size: 0.9em; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #3498db; }
        .btn-submit {
            width: 100%; padding: 10px; background: #3498db; color: #fff; border: none;
            border-radius: 3px; font-size: 0.95em; cursor: pointer; font-family: inherit;
            transition: background 0.2s; margin-top: 8px;
        }
        .btn-submit:hover { background: #2980b9; }
        .error-msg { color: #e74c3c; font-size: 0.85em; text-align: center; margin-top: 12px; min-height: 20px; }
        .info-msg { color: #27ae60; font-size: 0.85em; text-align: center; margin-top: 12px; min-height: 20px; }
        .switch-link {
            text-align: center; margin-top: 16px; font-size: 0.85em; color: #999;
        }
        .switch-link a { color: #3498db; text-decoration: none; cursor: pointer; }
        .switch-link a:hover { text-decoration: underline; }
        .hint { font-size: 0.8em; color: #999; margin-top: 20px; text-align: center; line-height: 1.8; }
        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>图书管理系统</h2>
        <p class="subtitle">Library Management System</p>

        <!-- 统一登录 -->
        <div id="panel-login" class="panel active">
            <form onsubmit="event.preventDefault(); doLogin();">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="loginUser" placeholder="请输入账号">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码">
                </div>
                <button type="submit" class="btn-submit">登 录</button>
                <p class="error-msg" id="loginError"></p>
            </form>
            <p class="switch-link">
                还没有账号？<a onclick="switchPanel('register')">立即注册</a>
            </p>
        </div>

        <!-- 读者注册 -->
        <div id="panel-register" class="panel">
            <form onsubmit="event.preventDefault(); doRegister();">
                <div class="form-group">
                    <label>学号 / 工号 *</label>
                    <input type="text" id="regReaderId" placeholder="例如：2024009">
                </div>
                <div class="form-group">
                    <label>姓名 *</label>
                    <input type="text" id="regName" placeholder="真实姓名">
                </div>
                <div class="form-group">
                    <label>密码 *</label>
                    <input type="password" id="regPassword" placeholder="设置登录密码">
                </div>
                <div class="form-group">
                    <label>院系</label>
                    <input type="text" id="regDept" placeholder="例如：计算机学院">
                </div>
                <div class="form-group">
                    <label>身份</label>
                    <select id="regType">
                        <option value="STUDENT">学生（借5本/30天）</option>
                        <option value="TEACHER">教师（借10本/60天）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="text" id="regPhone" placeholder="选填">
                </div>
                <button type="submit" class="btn-submit">注 册</button>
                <p class="error-msg" id="regError"></p>
                <p class="info-msg" id="regSuccess"></p>
            </form>
            <p class="switch-link">
                已有账号？<a onclick="switchPanel('login')">返回登录</a>
            </p>
        </div>

        <p class="hint">
            演示账号：管理员 admin / admin123<br>
            读者 2024001 / 123456
        </p>
    </div>

    <script>
        const API_B = window.location.origin + '/api';

        function switchPanel(name) {
            document.getElementById('panel-login').classList.toggle('active', name === 'login');
            document.getElementById('panel-register').classList.toggle('active', name === 'register');
            // 清空提示信息
            document.getElementById('loginError').textContent = '';
            document.getElementById('regError').textContent = '';
            document.getElementById('regSuccess').textContent = '';
        }

        async function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pw = document.getElementById('loginPassword').value;
            if (!user || !pw) {
                document.getElementById('loginError').textContent = '请输入用户名和密码';
                return;
            }
            try {
                const resp = await fetch(API_B + '/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pw })
                });
                const r = await resp.json();
                if (r.success) {
                    sessionStorage.setItem('auth', JSON.stringify(r));
                    window.location.href = '/index.html';
                } else {
                    document.getElementById('loginError').textContent = r.message;
                }
            } catch(e) {
                document.getElementById('loginError').textContent = '网络错误，请检查服务器是否启动';
            }
        }

        async function doRegister() {
            document.getElementById('regError').textContent = '';
            document.getElementById('regSuccess').textContent = '';
            const data = {
                readerId: document.getElementById('regReaderId').value.trim(),
                name: document.getElementById('regName').value.trim(),
                password: document.getElementById('regPassword').value.trim(),
                department: document.getElementById('regDept').value.trim(),
                readerType: document.getElementById('regType').value,
                phone: document.getElementById('regPhone').value.trim()
            };
            if (!data.readerId || !data.name || !data.password) {
                document.getElementById('regError').textContent = '学号、姓名和密码为必填项';
                return;
            }
            try {
                const resp = await fetch(API_B + '/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const r = await resp.json();
                if (r.success) {
                    document.getElementById('regSuccess').textContent = '注册成功！请返回登录';
                    document.getElementById('regReaderId').value = '';
                    document.getElementById('regName').value = '';
                    document.getElementById('regPassword').value = '';
                } else {
                    document.getElementById('regError').textContent = r.message;
                }
            } catch(e) {
                document.getElementById('regError').textContent = '网络错误';
            }
        }

        // 回车登录/注册
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                if (document.getElementById('panel-login').classList.contains('active')) {
                    doLogin();
                } else {
                    doRegister();
                }
            }
        });
    </script>
</body>
</html>
