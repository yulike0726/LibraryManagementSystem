<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读者管理 - 图书管理系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>图书管理系统</h1>
            <nav class="nav"><!-- 动态 --></nav>
        </div>
    </header>

    <main class="container main-content">
        <section class="card">
            <div class="card-header">
                <h2>读者管理</h2>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-primary" id="addReaderBtn" onclick="openModal('regReaderModal')">添加读者</button>
                </div>
            </div>
            <div class="card-body">
                <div class="search-bar">
                    <input type="text" id="readerKeyword" placeholder="搜索读者ID、姓名或院系..."
                           onkeypress="if(event.key==='Enter')searchReaders()">
                    <button class="btn btn-primary" onclick="searchReaders()">搜索</button>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-body">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>读者ID</th><th>姓名</th><th>院系</th>
                                <th>类型</th><th>借阅（已借/上限）</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="readerTableBody">
                            <tr><td colspan="6" class="text-center">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 弹窗省略，同之前 -->
        <div class="modal-overlay" id="regReaderModal">
            <div class="modal">
                <h3>添加读者</h3>
                <form onsubmit="event.preventDefault(); registerReader();">
                    <div class="form-group"><label>读者ID *</label><input type="text" id="regReaderId"></div>
                    <div class="form-group"><label>姓名 *</label><input type="text" id="regName"></div>
                    <div class="form-group"><label>院系</label><input type="text" id="regDepartment"></div>
                    <div class="form-group">
                        <label>类型</label>
                        <select id="regType">
                            <option value="STUDENT">学生</option>
                            <option value="TEACHER">教师</option>
                        </select>
                    </div>
                    <div class="form-group"><label>电话</label><input type="text" id="regPhone"></div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="closeModal('regReaderModal')">取消</button>
                        <button type="submit" class="btn btn-primary">确认添加</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal-overlay" id="editReaderModal">
            <div class="modal">
                <h3>编辑读者</h3>
                <form onsubmit="event.preventDefault(); updateReader();">
                    <input type="hidden" id="editReaderId">
                    <div class="form-group"><label>姓名 *</label><input type="text" id="editReaderName"></div>
                    <div class="form-group"><label>院系</label><input type="text" id="editReaderDept"></div>
                    <div class="form-group"><label>类型</label><select id="editReaderType"><option value="STUDENT">学生</option><option value="TEACHER">教师</option></select></div>
                    <div class="form-group"><label>电话</label><input type="text" id="editReaderPhone"></div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="closeModal('editReaderModal')">取消</button>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer"><p>图书管理系统 &copy; 2024 软件工程课程设计</p></footer>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/reader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initPage('readers');
            if (!isAdmin()) {
                document.getElementById('addReaderBtn').style.display = 'none';
            }
            searchReaders();
        });
    </script>
</body>
</html>
